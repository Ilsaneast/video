<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일산동부회중 집회 영상</title>
<meta property="og:title" content="일산동부회중 집회 영상">
<meta property="og:description" content="눌러서 영상 보기">
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px 20px">
<p id="msg">영상으로 이동 중입니다...</p>
<a id="link" href="#" style="display:none;font-size:20px;padding:14px 24px;background:#1a73e8;color:#fff;border-radius:8px;text-decoration:none">▶ 눌러서 영상 보기</a>
<script>
  var id = new URLSearchParams(location.search).get('v');
  if (!id) {
    document.getElementById('msg').textContent = '영상 주소가 없습니다.';
  } else {
    var target = 'https://drive.google.com/file/d/' + id + '/preview';
    var link = document.getElementById('link');
    link.style.display = 'inline-block';
    if (/KAKAOTALK/i.test(navigator.userAgent)) {
      var ext = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(target);
      link.href = ext;
      document.getElementById('msg').textContent = '아래 버튼을 눌러주세요';
      location.href = ext;
    } else {
      link.href = target;
      location.replace(target);
    }
  }
</script>
</body>
</html>
