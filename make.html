<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>집회 영상 링크 만들기</title>
<meta name="robots" content="noindex">
<style>
  body { font-family:sans-serif; padding:20px; max-width:600px; margin:auto; }
  label { font-weight:bold; display:block; margin-top:16px; }
  textarea, input { width:100%; box-sizing:border-box; font-size:16px; padding:10px; margin-top:6px; }
  textarea { height:80px; }
  #out { white-space:pre-wrap; background:#f1f3f4; padding:12px; border-radius:8px; margin-top:16px; min-height:60px; word-break:break-all; }
  button { font-size:18px; padding:12px; width:100%; margin-top:12px; background:#1a73e8; color:#fff; border:0; border-radius:8px; }
  #err { color:#d93025; margin-top:8px; }
</style>
</head>
<body>
<h2>집회 영상 링크 만들기</h2>

<label>제목 (여러 줄 가능)</label>
<textarea id="title" placeholder="일산동부 공개강연&#10;분노가 가득한 세상에서 평화를 이루는 방법"></textarea>

<label>구글 드라이브 링크</label>
<input id="drive" placeholder="https://drive.google.com/file/d/.../view">

<div id="err"></div>
<label>카톡에 보낼 문구</label>
<div id="out"></div>
<button id="copy">복사</button>

<script>
  var base = 'https://ilsaneast.github.io/video/?v=';
  function make() {
    var t = document.getElementById('title').value.trim();
    var d = document.getElementById('drive').value.trim();
    var m = d.match(/\/d\/([\w-]+)/) || d.match(/[?&]id=([\w-]+)/);
    var id = m ? m[1] : (/^[\w-]{20,}$/.test(d) ? d : '');
    document.getElementById('err').textContent = (d && !id) ? '드라이브 링크가 올바르지 않아요' : '';
    var link = id ? base + id : '';
    document.getElementById('out').textContent = (t ? t + '\n' : '') + link;
  }
  document.getElementById('title').addEventListener('input', make);
  document.getElementById('drive').addEventListener('input', make);
  document.getElementById('copy').addEventListener('click', function () {
    var text = document.getElementById('out').textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(function () {
      document.getElementById('copy').textContent = '복사됨!';
      setTimeout(function () { document.getElementById('copy').textContent = '복사'; }, 1500);
    });
  });
</script>
</body>
</html>
